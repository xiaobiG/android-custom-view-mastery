name: Build HonKit Book

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run audit
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: android-custom-view-book
          path: _book
